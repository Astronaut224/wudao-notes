function filteredTasks(){let q=document.getElementById('globalSearch').value.trim().toLowerCase();return tasks.filter(t=>(filter==='done'?t.status==='done':t.status!=='done')&&(filter==='all'||filter==='done'||t.priority===Number(filter))&&(!q||[t.title,t.next_action,t.description].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.priority-b.priority||a.sort_order-b.sort_order)}
function taskRow(t){return `<div class="todo-row ${selectedTodo===t.id?'selected':''}" onclick="selectTodo('${t.id}')"><button class="tick ${t.status==='done'?'done':''}" title="切换完成状态" onclick="event.stopPropagation();toggleDone('${t.id}')">${t.status==='done'?'✓':''}</button><div class="todo-main"><div class="todo-name ${t.status==='done'?'done':''}">${esc(t.title)}</div><div class="todo-next">${esc(t.next_action||'点击添加下一步动作')}</div></div><div class="pr ${cls(t.priority)}">${pstr(t.priority)}</div></div>`}
function renderTodos(){let data=filteredTasks(),groups=filter==='all'?[1,2,3]:filter==='done'?[1,2,3]:[Number(filter)];let html=`<div class="hrow"><div><h1 class="heading">我的待办</h1><p class="subtitle">按优先级安排手头的工作，先处理最重要的事</p></div><button class="primary" onclick="openDialog('todo')">＋ 新建待办</button></div><div class="filters">${[['all','全部'],['1','高优先'],['2','中优先'],['3','低优先'],['done','已完成']].map(([v,t])=>`<button class="chip ${filter===v?'active':''}" onclick="filter='${v}';render()">${t}</button>`).join('')}</div>`;for(const p of groups){let entries=data.filter(t=>t.priority===p);if(!entries.length)continue;html+=`<div class="group-title"><span class="group-dot ${p===2?'mid':p===3?'low':''}"></span>${p===1?'高优先':p===2?'中优先':'低优先'} · ${entries.length}</div>`+entries.map(taskRow).join('')}if(!data.length)html+='<div class="empty">这里暂时没有事项，新增一条开始吧。</div>';document.getElementById('listArea').innerHTML=html;let t=tasks.find(x=>x.id===selectedTodo);if(!t) {document.getElementById('detailArea').innerHTML='<div class="empty">点击一个待办，查看下一步和相关资料。</div>';return;}let res=t.resources||[];document.getElementById('detailArea').innerHTML=`<div class="small-label">待办详情</div><div class="detail-head"><div style="flex:1"><div class="d-title">${esc(t.title)}</div><div class="small-label">所有更改自动保存在本地预览</div></div><span class="pr ${cls(t.priority)}">${pstr(t.priority)}优先</span></div><div class="fieldgrid"><div class="field"><label>优先级</label><select class="edit" onchange="updateTodo('priority',Number(this.value))"><option value="1" ${t.priority===1?'selected':''}>高优先</option><option value="2" ${t.priority===2?'selected':''}>中优先</option><option value="3" ${t.priority===3?'selected':''}>低优先</option></select></div><div class="field"><label>截止日期（可选）</label><input class="edit" type="date" value="${esc(t.due_date||'')}" onchange="updateTodo('due_date',this.value)"/></div></div><div class="hr"></div><div class="field"><label>下一步做什么</label><input class="edit" id="nextAction" value="${esc(t.next_action)}" oninput="scheduleTodo('next_action',this.value)" placeholder="写一句下一步的具体动作"/></div><div class="field" style="margin-top:18px"><label>补充备注</label><textarea class="edit editarea" oninput="scheduleTodo('description',this.value)" placeholder="背景、客户反馈、沟通结论等">${esc(t.description)}</textarea></div><div class="hr"></div><div class="section-head"><span class="section-title">相关资料 <span style="color:#abb7c7;font-size:11px;font-weight:450">${res.length}</span></span><button class="section-add" onclick="openDialog('link')">＋ 添加链接</button></div>${res.map((r,i)=>`<div class="resource"><div class="ri">${r.type==='file'?'▤':r.type==='image'?'▧':'↗'}</div><div class="rname">${esc(r.name)}<div class="rsub">${esc(r.sub||'关联资料')}</div></div><button title="移除" onclick="removeResource(${i})">×</button></div>`).join('')||'<div style="color:#a3aebf;font-size:12px;padding:6px 0">暂未添加资料</div>'}<div style="margin-top:14px"><button class="secondary" onclick="toast('浏览器概念预览不持久化文件字节；原生应用会将附件复制到本地应用目录')">＋ 文件 / 图片</button></div><div class="hr"></div><div class="section-head"><span class="section-title">关联笔记</span><button class="section-add" onclick="openDialog('note')">＋ 新建笔记</button></div>${notes.filter(n=>n.todo_id===t.id).map(n=>`<div class="pill-note" onclick="selectedNote='${n.id}';switchTab('notes')">▤ ${esc(n.title)} <span style="margin-left:auto">›</span></div>`).join('')||'<div style="color:#a3aebf;font-size:12px">暂无关联笔记</div>'}<div class="detail-foot">备注和优先级可直接编辑；附件为界面示例，原生版将完整持久化。</div>`}
let debounce;function scheduleTodo(k,v){const ownerId=selectedTodo;clearTimeout(debounce);debounce=setTimeout(()=>{let t=tasks.find(x=>x.id===ownerId);if(t){t[k]=v;persist()}},650)}function updateTodo(k,v){let t=tasks.find(x=>x.id===selectedTodo);if(t){t[k]=v;persist();render()}}function toggleDone(id){let t=tasks.find(x=>x.id===id);if(t){t.status=t.status==='done'?'active':'done';persist();render()}}function selectTodo(id){selectedTodo=id;render()};function removeResource(i){if(!confirm('确定移除此资料关联？'))return;let t=tasks.find(x=>x.id===selectedTodo);t.resources.splice(i,1);persist();render()}
function filteredNotes(){let q=document.getElementById('globalSearch').value.trim().toLowerCase();return notes.filter(n=>(!q||[n.title,n.category,n.body].join(' ').toLowerCase().includes(q))).sort((a,b)=>Number(b.is_pinned)-Number(a.is_pinned))}function renderNotes(){let arr=filteredNotes(),n=notes.find(x=>x.id===selectedNote);document.getElementById('listArea').innerHTML=`<div class="hrow"><div><h1 class="heading">我的笔记</h1><p class="subtitle">随手记录，不必归属于某个待办</p></div><button class="primary" onclick="openDialog('note')">＋ 新建笔记</button></div><div class="note-categories"><button class="chip active">全部笔记</button></div>${arr.map(a=>`<div class="note-list-item ${selectedNote===a.id?'selected':''}" onclick="selectedNote='${a.id}';render()"><div class="note-item-title">${a.is_pinned?'📌 ':''}${esc(a.title)}</div><div class="note-preview">${esc(a.body.replace(/[#*`]/g,' ').slice(0,75))}</div><div class="note-time">${esc(a.category||'未分类')} · 最近编辑</div></div>`).join('')||'<div class="empty">还没有笔记</div>'}`;if(!n){document.getElementById('detailArea').innerHTML='<div class="empty">选择或新建一篇笔记。</div>';return;}document.getElementById('detailArea').innerHTML=`<div class="hrow"><span class="small-label">笔记编辑</span><button class="section-add" onclick="togglePin()">${n.is_pinned?'取消置顶':'置顶笔记'} ↗</button></div><input class="note-editor-title" value="${esc(n.title)}" oninput="scheduleNote('title',this.value)"/><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="small-label">分类</span><input class="category-input" value="${esc(n.category||'')}" placeholder="未分类" oninput="scheduleNote('category',this.value)" /></div><div class="note-toolbar"><span>** 粗体</span><span># 标题</span><span>≡ 列表</span><span>＜/＞ 代码</span><span>↗ 链接</span><span style="margin-left:auto;color:#a6b2c3">Markdown</span></div><textarea class="body-editor" oninput="scheduleNote('body',this.value)" placeholder="记录值得留下的内容...">${esc(n.body)}</textarea><div class="hr"></div><div class="section-head"><span class="section-title">关联待办（可选）</span></div><select class="edit" onchange="updateNote('todo_id',this.value||null)"><option value="">不关联任何待办</option>${tasks.map(t=>`<option value="${t.id}" ${n.todo_id===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select><div class="detail-foot">自动保存到浏览器本地，仅供交互预览；正式版使用 SQLite 和本地文件库。</div>`}function scheduleNote(k,v){const ownerId=selectedNote;clearTimeout(debounce);debounce=setTimeout(()=>{let n=notes.find(x=>x.id===ownerId);if(n){n[k]=v;persist()}},650)}function updateNote(k,v){let n=notes.find(x=>x.id===selectedNote);if(n){n[k]=v;persist();render()}}function togglePin(){let n=notes.find(x=>x.id===selectedNote);n.is_pinned=!n.is_pinned;persist();render()}
function render(){tab==='todo'?renderTodos():renderNotes()}function openDialog(type){dialogType=type;document.getElementById('dialogTitle').textContent=type==='todo'?'新建待办':type==='note'?'新建笔记':'添加网页链接';document.getElementById('dialogFields').innerHTML=type==='todo'?'<label>标题</label><input id="dtitle" class="edit" placeholder="例如：确认客户的最新修改意见" autofocus/><label>优先级</label><select class="edit" id="dpriority"><option value="2">中优先（默认）</option><option value="1">高优先</option><option value="3">低优先</option></select>':type==='note'?'<label>标题</label><input id="dtitle" class="edit" placeholder="例如：会议沟通纪要" autofocus/>':'<label>显示名称</label><input id="dtitle" class="edit" placeholder="例如：设计稿在线链接"/><label>网址</label><input id="durl" class="edit" placeholder="https://..."/>';document.getElementById('dialogOverlay').classList.add('show');setTimeout(()=>document.getElementById('dtitle')?.focus(),50)}function closeDialog(){document.getElementById('dialogOverlay').classList.remove('show')}function saveDialog(){let title=(document.getElementById('dtitle')?.value||'').trim();if(!title){toast('请填写标题');return;}if(dialogType==='todo'){let pr=Number(document.getElementById('dpriority').value);let t={id:'t'+Date.now(),title,next_action:'',priority:pr,status:'active',due_date:'',description:'',sort_order:tasks.filter(x=>x.priority===pr).length+1,resources:[]};tasks.push(t);selectedTodo=t.id;tab='todo'}else if(dialogType==='note'){let n={id:'n'+Date.now(),title,category:'',body:'',todo_id:tab==='todo'?selectedTodo:null,is_pinned:false};notes.push(n);selectedNote=n.id;tab='notes'}else{let url=document.getElementById('durl').value.trim();if(!/^https?:\/\//i.test(url)){toast('请输入 http:// 或 https:// 开头的网址');return;}let t=tasks.find(x=>x.id===selectedTodo);if(t){t.resources.push({type:'url',name:title,url,sub:'网页链接'})}}closeDialog();persist();switchTab(tab)}function previewMini(){document.getElementById('mini').style.display='block';document.body.classList.add('mini-page');renderMini()}function closeMini(){document.getElementById('mini').style.display='none';document.body.classList.remove('mini-page')}function renderMini(){let arr=tasks.filter(x=>x.status==='active').sort((a,b)=>a.priority-b.priority||a.sort_order-b.sort_order).slice(0,4);document.getElementById('miniCount').textContent='当前待办 · '+tasks.filter(x=>x.status==='active').length+' 项';document.getElementById('miniList').innerHTML=arr.map(t=>`<div class="compact-row"><button class="tick" onclick="toggleDone('${t.id}');renderMini()"></button><span class="flex1">${esc(t.title)}</span><span class="pr ${cls(t.priority)}">${pstr(t.priority)}</span></div>`).join('')}function addFromMini(){let title=document.getElementById('miniInput').value.trim();if(!title)return;let t={id:'t'+Date.now(),title,next_action:'',priority:2,status:'active',due_date:'',description:'',sort_order:tasks.length,resources:[]};tasks.push(t);document.getElementById('miniInput').value='';persist();renderMini();render();toast('已添加待办')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}if(e.key==='Escape'){closeDialog()}});document.getElementById('dialogOverlay').addEventListener('click',e=>{if(e.target.id==='dialogOverlay')closeDialog()});switchTab(tab);if(new URLSearchParams(location.search).get('view')==='compact'){previewMini()}
</script>
</body>
</html>
